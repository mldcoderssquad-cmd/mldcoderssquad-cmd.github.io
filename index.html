```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to My Repository</title>

  <meta
    name="description"
    content="Welcome to my project repository. Explore projects, source code, and updates."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 18px;
      color: #1f2937;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #606b7a;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e8edf5;
      color: #1f2937;
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 35px;
      color: #8a94a3;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 28px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Welcome to My Repository</h1>

    <p>
      Explore my projects, source code, and development work.
      This repository contains resources and updates related to my work.
    </p>

    <div class="buttons">
      <a
        class="btn primary"
        href="https://github.com/YOUR-USERNAME/YOUR-REPOSITORY"
      >
        View Repository
      </a>

      <a class="btn secondary" href="https://github.com/YOUR-USERNAME">
        Visit GitHub Profile
      </a>
    </div>

    <footer>
      © 2026 · All rights reserved.
    </footer>
  </main>
</body>
</html>
